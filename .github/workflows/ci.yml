name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    # Bridge: org pr-isolated runner offline (chef-runner-01 retired). ubuntu-latest
    # still works (see design-system-contract.yml). Restore self-hosted when fleet lane is live.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks (working tree)
        run: gitleaks detect --source . --no-git --verbose --redact
      - name: Pattern guard
        run: bash scripts/check-secrets.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/telemetry/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix worker/telemetry
      - run: npm run check:version
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - run: npm run check:consumer-install
      - run: npm run check --prefix worker/telemetry
      # Filtered worker audit: tolerates documented upstream-deferred dev-only
      # advisories (see scripts/worker-audit.mjs) while still failing on any
      # new high/critical advisory. The worker is excluded from the npm tarball.
      - run: node scripts/worker-audit.mjs

  pi-minimum:
    name: Pi 0.80.10 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pin Pi packages to 0.80.10
        run: |
          npm install --ignore-scripts --save-dev \
            @earendil-works/pi-agent-core@0.80.10 \
            @earendil-works/pi-ai@0.80.10 \
            @earendil-works/pi-coding-agent@0.80.10
      - run: npm run build
      - run: npm test

  pi-latest:
    name: Pi latest compatible
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Upgrade Pi packages to latest
        run: |
          npm install --ignore-scripts --save-dev \
            @earendil-works/pi-agent-core@latest \
            @earendil-works/pi-ai@latest \
            @earendil-works/pi-coding-agent@latest
      - run: npm run build
      - run: npm test

  notify-linear-on-failure:
    name: Notify Linear on CI failure
    if: failure() && github.event_name != 'merge_group'
    needs: [secrets, test, pi-minimum, pi-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TITLE: "CI Failure: ${{ github.workflow }} in pi-zai"
          RUN_URL: https://github.com/GroepOnline/pi-zai/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "LINEAR_API_KEY secret not configured — skipping Linear notification (fail-open)"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          BODY="Workflow **${WORKFLOW_NAME}** failed in [pi-zai](https://github.com/GroepOnline/pi-zai)

          Run: ${RUN_URL}
          Branch: ${BRANCH_NAME}
          SHA: ${SHORT_SHA}

          Created automatically by CI failure tracker."
          jq -n \
            --arg title "$TITLE" \
            --arg description "$BODY" \
            '{
              query: "mutation($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { id identifier } } }",
              variables: {
                input: {
                  title: $title,
                  description: $description,
                  teamId: "bbd2b9e0-e644-4717-9074-8d0eaa3f150a",
                  priority: 2,
                  labelIds: ["713eee90-d169-40a6-98b8-7c71502b9855"]
                }
              }
            }' \
            | curl --fail --silent --show-error -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              --data-binary @- \
            | jq -er '
                if ((.errors // []) | length) > 0 then
                  error("Linear GraphQL mutation failed")
                elif (.data.issueCreate.success // true) == false then
                  error("Linear issueCreate reported success=false")
                elif .data.issueCreate.issue.identifier then
                  .data.issueCreate.issue.identifier
                else
                  error("Linear response did not include an issue identifier")
                end
              '
